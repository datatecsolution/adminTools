# SOLO LABORATORIO (drop-in de pos-kiosk.service). Nunca en una caja real.
# La GPU virtual de QEMU (virtio-gpu sin aceleración) no sirve para OpenGL:
#  - WLR_RENDERER=pixman: cage (wlroots) dibuja por software; con OpenGL dejaba la
#    pantalla congelada en el primer cuadro aunque Chromium siguiera navegando.
#  - --disable-gpu: Chromium sin GPU (sin esto, pantalla en blanco:
#    «Failed to send GpuControl.CreateCommandBuffer»).
# --remote-debugging-port: para manejar el kiosco desde la Mac en la batería (etapa E);
#   lab-cdp.service lo expone en mgmt0 y QEMU lo reenvía a 127.0.0.1:9223 de la Mac.
# Ojo: en systemd, Environment= con espacios va entre comillas o se corta.
[Service]
Environment=WLR_RENDERER=pixman
Environment="POS_EXTRA_FLAGS=--disable-gpu --remote-debugging-port=9222"
